id: accounts.no-empty-passwords
title: Assess empty local password records
summary: Identify local accounts with empty or missing password records.
rationale: Identify local accounts with empty or missing password records.
benefits:
- Expose unsafe local identity state for operator review.
tradeoffs:
- Assessment only. Does not delete, renumber, lock accounts, or rewrite login paths.
applies_to:
  os: [rocky, rhel]
  major_version: 10
  role: server
impact: low
impact_note: Read-only assessment. Resolve findings through an approved account maintenance
  process.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties: {}
implemented: true
reboot_required: false
supported_modes:
- audit
- verify
implementation:
  audit: ansible/tasks/accounts.no-empty-passwords.audit.yml
  verify: ansible/tasks/accounts.no-empty-passwords.verify.yml
