id: auth.failed-login-lockout
title: Bound repeated local authentication failures
summary: Bound repeated local authentication failures through the supported local authentication stack.
rationale: Enforce explicit local credential rules without replacing domain-managed authentication.
benefits:
- Uses native PAM configuration and authselect features, preserving unrelated enabled features.
tradeoffs:
- Applies to local users of the system-auth and password-auth PAM stacks, not an individual account list.
  Existing credentials are not rotated.
- Only an intact vendor local profile and modeled options are supported. Root retains native password-change
  exceptions. Lockout exempts root and the supplied recovery group; counters use the native volatile directory.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: high
impact_note: Draft, unavailable until identity policy and mutating guest acceptance are complete. New
  passwords or authentication attempts can be rejected. Require independently rehearsed recovery.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    attempts:
      type: integer
      minimum: 1
      maximum: 20
    interval_seconds:
      type: integer
      minimum: 30
      maximum: 3600
    unlock_seconds:
      type: integer
      minimum: 30
      maximum: 86400
    exempt_group:
      type: string
      pattern: ^[a-z_][a-z0-9_-]{0,31}$
      description: Existing local recovery group. Root and this group remain exempt.
  required:
  - attempts
  - interval_seconds
  - unlock_seconds
  - exempt_group
implemented: false
reboot_required: false
implementation:
  audit: ansible/tasks/auth.failed-login-lockout.audit.yml
  apply: ansible/tasks/auth.failed-login-lockout.apply.yml
  verify: ansible/tasks/auth.failed-login-lockout.verify.yml
  preflight: ansible/tasks/auth.failed-login-lockout.preflight.yml
