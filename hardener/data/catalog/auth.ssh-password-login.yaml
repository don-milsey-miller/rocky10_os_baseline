id: auth.ssh-password-login
title: Disable SSH password authentication
summary: Disable SSH password authentication.
rationale: Remove password and keyboard-interactive login paths only after independent public-key recovery
  succeeds.
benefits:
- Remove password and keyboard-interactive login paths only after independent public-key recovery succeeds.
tradeoffs:
- Requires the standard local configuration layout and a working independent public-key SSH/sudo recovery
  path. Custom Match, include, or service overrides require operator review.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: high
impact_note: May affect new administrative sessions. A fresh public-key connection and noninteractive
  sudo are checked before and after remediation.
requires:
- auth.ssh-config-permissions
- auth.ssh-hostkey-permissions
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties: {}
  required: []
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/auth.ssh-password-login.audit.yml
  apply: ansible/tasks/auth.ssh-password-login.apply.yml
  verify: ansible/tasks/auth.ssh-password-login.verify.yml
  preflight: ansible/tasks/auth.ssh-password-login.preflight.yml
