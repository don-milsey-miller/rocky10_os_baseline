id: packages.security-update-status
title: Assess published security updates
summary: Report pending security updates from fresh advisory metadata for selected repositories.
rationale: Report pending security updates from fresh advisory metadata for selected repositories.
benefits:
- Report pending security updates from fresh advisory metadata for selected repositories.
tradeoffs:
- Assessment only. Does not upgrade packages. Requires reachable repositories with advisory metadata.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: medium
impact_note: Assessment only. Does not upgrade packages. Requires reachable repositories with advisory
  metadata.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  required:
  - repositories
  properties:
    repositories:
      type: array
      minItems: 1
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,79}$
      description: Explicit repository IDs covered by this control. Other repositories are untouched.
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/packages.security-update-status.audit.yml
  verify: ansible/tasks/packages.security-update-status.verify.yml
supported_modes:
- audit
- verify
