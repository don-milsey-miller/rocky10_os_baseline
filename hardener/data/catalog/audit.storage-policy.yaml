id: audit.storage-policy
title: Apply an explicit local audit storage budget
summary: Set supplied rotation limits, free-space thresholds and failure actions, then verify native reload
  acceptance.
rationale: Make selected server security state independently observable and reproducible.
benefits:
- Reports native state without publishing raw security event payloads.
tradeoffs:
- 'Only modeled native units and watch rules are supported. Rule suppression and unknown finalization
  are refused. Recovery: restore the guest snapshot, or remove the owned rule files and reboot through
  the recovery console.'
applies_to:
  os: [rocky, rhel]
  major_version: 10
  role: server
impact: high
impact_note: Requires independently rehearsed recovery and explicit workload policy.
requires:
- audit.service-enabled
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    max_log_file_mib:
      type: integer
      minimum: 8
      maximum: 1024
    num_logs:
      type: integer
      minimum: 2
      maximum: 99
    space_left_mib:
      type: integer
      minimum: 16
      maximum: 65536
    admin_space_left_mib:
      type: integer
      minimum: 8
      maximum: 65535
    space_left_action:
      enum:
      - syslog
      - suspend
    admin_space_left_action:
      enum:
      - syslog
      - suspend
    disk_full_action:
      enum:
      - syslog
      - suspend
    disk_error_action:
      enum:
      - syslog
      - suspend
  required:
  - max_log_file_mib
  - num_logs
  - space_left_mib
  - admin_space_left_mib
  - space_left_action
  - admin_space_left_action
  - disk_full_action
  - disk_error_action
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/audit.storage-policy.audit.yml
  apply: ansible/tasks/audit.storage-policy.apply.yml
  verify: ansible/tasks/audit.storage-policy.verify.yml
  preflight: ansible/tasks/audit.storage-policy.preflight.yml
