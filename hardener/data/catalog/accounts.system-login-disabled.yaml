id: accounts.system-login-disabled
title: Disable login shells for selected system accounts
summary: Disable login shells for selected system accounts.
rationale: Apply approved local account policy only to explicitly classified identities.
benefits:
- Preserve unselected accounts and unrelated account properties.
tradeoffs:
- Requires a local authselect profile. Root and the recovery identity cannot be selected. No password,
  last-change date, account expiry, home contents, or recursive ownership changes.
- Aging and inactivity limits can deny access after password expiry. System accounts must have UID below
  1000. Home changes support ordinary /home/account directories without ACLs.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: high
impact_note: Draft, unavailable until identity policy and mutating guest acceptance are complete. Account
  policy may affect subsequent logins. Require independent recovery and fresh administrative access.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    users:
      type: array
      minItems: 1
      maxItems: 16
      uniqueItems: true
      items:
        type: string
        pattern: ^[a-z_][a-z0-9_-]{0,31}$
      description: Explicit local account names. Root and the connected recovery identity are refused.
  required:
  - users
implemented: false
reboot_required: false
implementation:
  audit: ansible/tasks/accounts.system-login-disabled.audit.yml
  apply: ansible/tasks/accounts.system-login-disabled.apply.yml
  verify: ansible/tasks/accounts.system-login-disabled.verify.yml
  preflight: ansible/tasks/accounts.system-login-disabled.preflight.yml
