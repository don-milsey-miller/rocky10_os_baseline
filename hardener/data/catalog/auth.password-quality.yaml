id: auth.password-quality
title: Enforce local password length
summary: Enforce local password length through the supported local authentication stack.
rationale: Enforce explicit local credential rules without replacing domain-managed authentication.
benefits:
- Uses native PAM configuration and authselect features, preserving unrelated enabled features.
tradeoffs:
- Applies to local users of the system-auth and password-auth PAM stacks, not an individual account list.
  Existing credentials are not rotated.
- Only an intact vendor local profile and modeled options are supported. Root retains native password-change
  exceptions. Lockout exempts root and the supplied recovery group; counters use the native volatile directory.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: high
impact_note: New passwords or authentication attempts can be rejected. Require independently rehearsed
  recovery.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    minimum_length:
      type: integer
      minimum: 8
      maximum: 64
  required:
  - minimum_length
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/auth.password-quality.audit.yml
  apply: ansible/tasks/auth.password-quality.apply.yml
  verify: ansible/tasks/auth.password-quality.verify.yml
  preflight: ansible/tasks/auth.password-quality.preflight.yml
