id: auth.sudo-timeout
title: Bound selected administrator credential caches
summary: Apply explicit credential-cache lifetime to the same selected authenticated administrators.
rationale: Limit reuse of previously authenticated sudo credentials for explicitly selected accounts.
benefits:
- Limit reuse of previously authenticated sudo credentials for explicitly selected accounts.
tradeoffs:
- Automatic policy changes support standard local unrestricted administrators only. Domain sources, restricted
  command grants, special authentication defaults, and changes to the active recovery identity require
  operator review.
applies_to:
  os: [rocky, rhel]
  major_version: 10
  role: server
impact: high
impact_note: May affect new administrative sessions. A fresh public-key connection and noninteractive
  sudo are checked before and after remediation.
requires:
- auth.sudo-config-permissions
- auth.sudo-authentication
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    users:
      type: array
      minItems: 1
      maxItems: 16
      uniqueItems: true
      items:
        type: string
        maxLength: 32
        pattern: ^[a-z_][a-z0-9_-]*[$]?$
    minutes:
      type: integer
      minimum: 0
      maximum: 60
  required:
  - users
  - minutes
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/auth.sudo-timeout.audit.yml
  apply: ansible/tasks/auth.sudo-timeout.apply.yml
  verify: ansible/tasks/auth.sudo-timeout.verify.yml
  preflight: ansible/tasks/auth.sudo-timeout.preflight.yml
