id: network.ipv6-redirects-disabled
title: Reject IPv6 redirects
summary: Reject redirect messages without disabling IPv6 or router advertisements.
rationale: Reject redirect messages without disabling IPv6 or router advertisements.
benefits:
- Reject redirect messages without disabling IPv6 or router advertisements.
tradeoffs:
- Only select for an approved non-routing server. Workloads that depend on redirects or forwarding require
  exclusion.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: medium
impact_note: Only select for an approved non-routing server. Workloads that depend on redirects or forwarding
  require exclusion.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    network_role:
      type: string
      enum:
      - non-routing
  required:
  - network_role
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/network.ipv6-redirects-disabled.audit.yml
  apply: ansible/tasks/network.ipv6-redirects-disabled.apply.yml
  verify: ansible/tasks/network.ipv6-redirects-disabled.verify.yml
  preflight: ansible/tasks/network.ipv6-redirects-disabled.preflight.yml
