id: integrity.aide-scheduled
title: Check an approved file integrity baseline
summary: Initialize only an explicitly approved AIDE scope once and schedule independent integrity checks.
rationale: Make selected server security state independently observable and reproducible.
benefits:
- Reports native state without publishing raw security event payloads.
tradeoffs:
- 'AIDE monitors only explicit directories. Existing baseline scope and content are never refreshed automatically.
  Recovery: disable rocky10-aide.timer and restore the approved database and configuration from trusted
  backup.'
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: high
impact_note: Requires independently rehearsed recovery and explicit workload policy.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    paths:
      type: array
      minItems: 1
      maxItems: 8
      uniqueItems: true
      items:
        type: string
        maxLength: 200
        pattern: ^/(etc|usr|opt|srv)(/[A-Za-z0-9_-]+)*$
    initialize_baseline:
      type: boolean
    schedule:
      enum:
      - daily
      - weekly
  required:
  - paths
  - initialize_baseline
  - schedule
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/integrity.aide-scheduled.audit.yml
  apply: ansible/tasks/integrity.aide-scheduled.apply.yml
  verify: ansible/tasks/integrity.aide-scheduled.verify.yml
  preflight: ansible/tasks/integrity.aide-scheduled.preflight.yml
