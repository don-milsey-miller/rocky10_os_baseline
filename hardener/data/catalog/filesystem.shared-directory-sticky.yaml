id: filesystem.shared-directory-sticky
title: Protect explicit shared writable directories
summary: Add the sticky bit to selected existing root-owned shared directories without recursive changes.
rationale: Limit filesystem behavior only where the operator confirms application compatibility.
benefits:
- Preserve unselected options, ownership and file contents.
tradeoffs:
- Mount restrictions can prevent applications from executing temporary files or using devices and privileged
  binaries.
- Only explicit root-owned shared directories are changed. Existing file ownership and application access
  are preserved.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: medium
impact_note: Confirm workload compatibility and use snapshot recovery.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    paths:
      type: array
      minItems: 1
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        pattern: ^/[^\\\n\r]*$
        maxLength: 256
  required:
  - paths
implemented: true
reboot_required: false
implementation:
  preflight: ansible/tasks/filesystem.shared-directory-sticky.preflight.yml
  audit: ansible/tasks/filesystem.shared-directory-sticky.audit.yml
  apply: ansible/tasks/filesystem.shared-directory-sticky.apply.yml
  verify: ansible/tasks/filesystem.shared-directory-sticky.verify.yml
