{
  "id": "kernel.protected-hardlinks",
  "title": "Restrict hard-link creation",
  "summary": "Set persistent and running fs.protected_hardlinks to 1.",
  "rationale": "Limit hard links to files the caller may safely link.",
  "benefits": [
    "Reduces opportunities to exploit shared writable directories."
  ],
  "tradeoffs": [
    "Legacy workflows that link another user's files may fail."
  ],
  "applies_to": {
    "os": ["rocky", "rhel"],
    "major_version": 10,
    "role": "server"
  },
  "impact": "low",
  "impact_note": "Review shared-file workflows before enabling.",
  "requires": [],
  "conflicts_with": [],
  "parameters": {
    "type": "object",
    "additionalProperties": false,
    "properties": {}
  },
  "implemented": true,
  "reboot_required": false,
  "implementation": {
    "audit": "ansible/tasks/kernel.protected-hardlinks.audit.yml",
    "apply": "ansible/tasks/kernel.protected-hardlinks.apply.yml",
    "verify": "ansible/tasks/kernel.protected-hardlinks.verify.yml"
  }
}
