id: auth.password-history
title: Prevent local password reuse
summary: Prevent local password reuse through the supported local authentication stack.
rationale: Enforce explicit local credential rules without replacing domain-managed authentication.
benefits:
- Uses native PAM configuration and authselect features, preserving unrelated enabled features.
tradeoffs:
- Applies to local users of the system-auth and password-auth PAM stacks, not an individual account list.
  Existing credentials are not rotated.
- Only an intact vendor local profile and modeled options are supported. Root retains native password-change
  exceptions. Lockout exempts root and the supplied recovery group; counters use the native volatile directory.
applies_to:
  os: [rocky, rhel]
  major_version: 10
  role: server
impact: high
impact_note: New passwords or authentication attempts can be rejected. Require independently rehearsed
  recovery.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    remember:
      type: integer
      minimum: 1
      maximum: 100
      description: Native pam_pwhistory retained-entry count. The current password is saved before checking
        a replacement and counts toward this limit.
  required:
  - remember
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/auth.password-history.audit.yml
  apply: ansible/tasks/auth.password-history.apply.yml
  verify: ansible/tasks/auth.password-history.verify.yml
  preflight: ansible/tasks/auth.password-history.preflight.yml
