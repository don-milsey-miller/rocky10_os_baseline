id: auth.ssh-hostbased-auth
title: Disable SSH host-based authentication
summary: Disable SSH host-based authentication.
rationale: Avoid accepting another host as the authentication authority for a local account.
benefits:
- Avoid accepting another host as the authentication authority for a local account.
tradeoffs:
- Requires the standard local configuration layout and a working independent public-key SSH/sudo recovery
  path. Custom Match, include, or service overrides require operator review.
applies_to:
  os: [rocky, rhel]
  major_version: 10
  role: server
impact: high
impact_note: May affect new administrative sessions. A fresh public-key connection and noninteractive
  sudo are checked before and after remediation.
requires:
- auth.ssh-config-permissions
- auth.ssh-hostkey-permissions
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties: {}
  required: []
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/auth.ssh-hostbased-auth.audit.yml
  apply: ansible/tasks/auth.ssh-hostbased-auth.apply.yml
  verify: ansible/tasks/auth.ssh-hostbased-auth.verify.yml
  preflight: ansible/tasks/auth.ssh-hostbased-auth.preflight.yml
