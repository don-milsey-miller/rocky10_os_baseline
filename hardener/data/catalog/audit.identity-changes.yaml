id: audit.identity-changes
title: Record local identity database writes
summary: Watch local passwd, group, shadow and gshadow writes and metadata changes.
rationale: Make selected server security state independently observable and reproducible.
benefits:
- Reports native state without publishing raw security event payloads.
tradeoffs:
- 'Only modeled native units and watch rules are supported. Rule suppression and unknown finalization
  are refused. Recovery: restore the guest snapshot, or remove the owned rule files and reboot through
  the recovery console.'
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: medium
impact_note: Inspect native state and preserve unrelated policy.
requires:
- audit.service-enabled
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties: {}
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/audit.identity-changes.audit.yml
  apply: ansible/tasks/audit.identity-changes.apply.yml
  verify: ansible/tasks/audit.identity-changes.verify.yml
  preflight: ansible/tasks/audit.identity-changes.preflight.yml
