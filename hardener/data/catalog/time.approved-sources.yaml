id: time.approved-sources
title: Use explicit approved time sources
summary: Replace time-source directives with approved sources and verify a synchronized running clock.
rationale: Replace time-source directives with approved sources and verify a synchronized running clock.
benefits:
- Replace time-source directives with approved sources and verify a synchronized running clock.
tradeoffs:
- Changes the explicitly selected service policy. Test workload compatibility and preserve recovery access.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: medium
impact_note: Service restarts may be required. Site-specific policy values are explicit.
requires:
- time.chrony-enabled
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    sources:
      type: array
      minItems: 1
      maxItems: 16
      uniqueItems: true
      items:
        type: string
        maxLength: 253
        pattern: ^[A-Za-z0-9][A-Za-z0-9.:-]*$
    source_type:
      type: string
      enum:
      - server
      - pool
  required:
  - sources
  - source_type
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/time.approved-sources.audit.yml
  apply: ansible/tasks/time.approved-sources.apply.yml
  verify: ansible/tasks/time.approved-sources.verify.yml
  preflight: ansible/tasks/time.approved-sources.preflight.yml
