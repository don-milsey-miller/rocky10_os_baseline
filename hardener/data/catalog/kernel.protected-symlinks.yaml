id: kernel.protected-symlinks
title: Restrict unsafe symbolic link following in shared directories
summary: Set fs.protected_symlinks=1 in runtime and persistent configuration.
rationale: Restrict unsafe symbolic link following in shared directories.
benefits:
- Restrict unsafe symbolic link following in shared directories.
tradeoffs:
- Changes only the named kernel setting. Privileged dump policy can affect diagnostics.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: low
impact_note: Changes only the named kernel setting. Privileged dump policy can affect
  diagnostics.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties: {}
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/kernel.protected-symlinks.audit.yml
  apply: ansible/tasks/kernel.protected-symlinks.apply.yml
  verify: ansible/tasks/kernel.protected-symlinks.verify.yml
  preflight: ansible/tasks/kernel.protected-symlinks.preflight.yml
