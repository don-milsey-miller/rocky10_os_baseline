id: logging.rotation-policy
title: Rotate explicitly selected logs
summary: Manage bounded rotation for explicit logs using the native parser and existing timer.
rationale: Bound retained application logs without replacing distribution rotation policy.
benefits:
- Bound retention of selected logs.
tradeoffs:
- The writer must reopen rotated files. Choose the fixed rsyslog HUP action only for rsyslog-owned logs,
  or explicitly manage application reopening externally.
applies_to:
  os: [rocky, rhel]
  major_version: 10
  role: server
impact: medium
impact_note: Service restarts may be required. Site-specific policy values are explicit.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    paths:
      type: array
      minItems: 1
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        maxLength: 240
        pattern: ^/var/log/(?!\.{1,2}(?:/|$))(?!.*\/\.{1,2}(?:/|$))[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*$
    mode:
      type: string
      enum:
      - '0600'
      - '0640'
    frequency:
      type: string
      enum:
      - daily
      - weekly
      - monthly
    retain:
      type: integer
      minimum: 1
      maximum: 365
    reopen:
      type: string
      enum:
      - none
      - rsyslog
  required:
  - paths
  - mode
  - frequency
  - retain
  - reopen
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/logging.rotation-policy.audit.yml
  apply: ansible/tasks/logging.rotation-policy.apply.yml
  verify: ansible/tasks/logging.rotation-policy.verify.yml
  preflight: ansible/tasks/logging.rotation-policy.preflight.yml
