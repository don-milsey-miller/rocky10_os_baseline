id: kernel.suid-dumpable
title: Prevent ordinary dumps from privileged executable processes
summary: Set fs.suid_dumpable=0 in runtime and persistent configuration.
rationale: Prevent ordinary dumps from privileged executable processes.
benefits:
- Prevent ordinary dumps from privileged executable processes.
tradeoffs:
- Changes only the named kernel setting. Privileged dump policy can affect diagnostics.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: low
impact_note: Changes only the named kernel setting. Privileged dump policy can affect
  diagnostics.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties: {}
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/kernel.suid-dumpable.audit.yml
  apply: ansible/tasks/kernel.suid-dumpable.apply.yml
  verify: ansible/tasks/kernel.suid-dumpable.verify.yml
  preflight: ansible/tasks/kernel.suid-dumpable.preflight.yml
