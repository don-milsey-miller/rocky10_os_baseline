id: packages.repository-signature-check
title: Require signed packages from selected repositories
summary: Require signed packages from selected repositories.
rationale: Require signed packages from selected repositories.
benefits:
- Require signed packages from selected repositories.
tradeoffs:
- Requires an explicit repository list. Other repositories and operator command-line overrides are outside
  this control.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: medium
impact_note: Requires an explicit repository list. Other repositories and operator command-line overrides
  are outside this control.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  required:
  - repositories
  properties:
    repositories:
      type: array
      minItems: 1
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,79}$
      description: Explicit repository IDs covered by this control. Other repositories are untouched.
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/packages.repository-signature-check.audit.yml
  apply: ansible/tasks/packages.repository-signature-check.apply.yml
  verify: ansible/tasks/packages.repository-signature-check.verify.yml
  preflight: ansible/tasks/packages.repository-signature-check.preflight.yml
