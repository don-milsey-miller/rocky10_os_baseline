id: boot.loader-authentication
title: Protect BIOS boot editing
summary: Use a private external PBKDF2 credential with the native GRUB authentication hook.
rationale: Use a private external PBKDF2 credential with the native GRUB authentication hook.
benefits:
- Make selected server protection explicit and independently inspectable.
tradeoffs:
- Requires workload compatibility and a tested independent recovery path.
- Credential material remains in private target files outside profiles and reports.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: high
impact_note: Use only after confirming the selected workload and provisioning prerequisites.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    hash_file:
      type: string
      pattern: ^/[^\\\n\r]*$
      maxLength: 256
  required:
  - hash_file
implemented: true
reboot_required: false
implementation:
  preflight: ansible/tasks/boot.loader-authentication.preflight.yml
  audit: ansible/tasks/boot.loader-authentication.audit.yml
  apply: ansible/tasks/boot.loader-authentication.apply.yml
  verify: ansible/tasks/boot.loader-authentication.verify.yml
