id: network.ipv4-source-route-disabled
title: Reject IPv4 source-routed packets
summary: Set IPv4 source-route acceptance to zero for all current and future interfaces.
rationale: Blocks source-route options that could bypass the intended route.
benefits:
- Blocks source-route options that could bypass the intended route.
tradeoffs:
- Applications requiring IPv4 source routing must exclude this control.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: low
impact_note: Applications requiring IPv4 source routing must exclude this control.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties: {}
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/network.ipv4-source-route-disabled.audit.yml
  apply: ansible/tasks/network.ipv4-source-route-disabled.apply.yml
  verify: ansible/tasks/network.ipv4-source-route-disabled.verify.yml
  preflight: ansible/tasks/network.ipv4-source-route-disabled.preflight.yml
