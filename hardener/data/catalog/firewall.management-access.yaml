id: firewall.management-access
title: Stage approved administrative access
summary: Stage approved administrative access.
rationale: Keep one firewall owner and make allowed inbound traffic explicit.
benefits:
- Preserves tested administrative recovery while limiting unexpected exposure.
tradeoffs:
- Supports a non-routing NetworkManager Ethernet host with the nftables backend and exclusive firewalld
  table ownership. Custom zones, policies, direct rules and competing managers require reconciliation.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: high
impact_note: Requires recent recovery evidence. Changes are guarded by a 120-second firewall rollback
  timer until native verification and fresh SSH/sudo succeed.
requires:
- firewall.firewalld-enabled
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    ssh_port:
      type: integer
      minimum: 1
      maximum: 65535
    ipv4_sources:
      type: array
      items:
        type: string
        maxLength: 64
      minItems: 1
      maxItems: 32
      uniqueItems: true
    ipv6_sources:
      type: array
      items:
        type: string
        maxLength: 64
      minItems: 1
      maxItems: 32
      uniqueItems: true
  required:
  - ssh_port
  - ipv4_sources
  - ipv6_sources
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/firewall.management-access.audit.yml
  apply: ansible/tasks/firewall.management-access.apply.yml
  verify: ansible/tasks/firewall.management-access.verify.yml
  preflight: ansible/tasks/firewall.management-access.preflight.yml
