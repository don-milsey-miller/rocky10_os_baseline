id: files.group-permissions
title: Protect group file metadata
summary: Set /etc/group to root:root 0644.
rationale: Prevent unauthorized modification or disclosure of local identity records.
benefits:
- Prevent unauthorized modification or disclosure of local identity records.
tradeoffs:
- Rejects extended ACLs and non-regular or multiply-linked files. File contents are
  preserved.
applies_to:
  os: [rocky, rhel]
  major_version: 10
  role: server
impact: low
impact_note: Rejects extended ACLs and non-regular or multiply-linked files. File
  contents are preserved.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties: {}
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/files.group-permissions.audit.yml
  apply: ansible/tasks/files.group-permissions.apply.yml
  verify: ansible/tasks/files.group-permissions.verify.yml
  preflight: ansible/tasks/files.group-permissions.preflight.yml
