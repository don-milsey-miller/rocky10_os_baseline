id: logging.logfile-permissions
title: Protect explicitly selected log files
summary: Restrict modes on named log files while retaining service ownership and contents.
rationale: Restrict modes on named log files while retaining service ownership and contents.
benefits:
- Restrict modes on named log files while retaining service ownership and contents.
tradeoffs:
- Changes the explicitly selected service policy. Test workload compatibility and preserve recovery access.
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: medium
impact_note: Service restarts may be required. Site-specific policy values are explicit.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    paths:
      type: array
      minItems: 1
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        maxLength: 240
        pattern: ^/var/log/(?!\.{1,2}(?:/|$))(?!.*\/\.{1,2}(?:/|$))[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*$
    mode:
      type: string
      enum:
      - '0600'
      - '0640'
  required:
  - paths
  - mode
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/logging.logfile-permissions.audit.yml
  apply: ansible/tasks/logging.logfile-permissions.apply.yml
  verify: ansible/tasks/logging.logfile-permissions.verify.yml
  preflight: ansible/tasks/logging.logfile-permissions.preflight.yml
