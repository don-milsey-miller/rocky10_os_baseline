id: selinux.targeted-policy
title: Retain the targeted SELinux policy
summary: Require the loaded and configured targeted policy.
rationale: Make selected server security state independently observable and reproducible.
benefits:
- Reports native state without publishing raw security event payloads.
tradeoffs:
- 'Disabled or non-targeted running policy requires a separately reviewed relabel and reboot. Recovery:
  restore the independently rehearsed guest snapshot.'
applies_to:
  os: rocky
  major_version: 10
  role: server
impact: high
impact_note: Requires independently rehearsed recovery and explicit workload policy.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties: {}
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/selinux.targeted-policy.audit.yml
  apply: ansible/tasks/selinux.targeted-policy.apply.yml
  verify: ansible/tasks/selinux.targeted-policy.verify.yml
  preflight: ansible/tasks/selinux.targeted-policy.preflight.yml
