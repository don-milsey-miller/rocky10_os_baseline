id: audit.service-enabled
title: Keep native auditing active
summary: Enable auditd and boot rule loading, and verify the kernel audit daemon is attached.
rationale: Make selected server security state independently observable and reproducible.
benefits:
- Reports native state without publishing raw security event payloads.
tradeoffs:
- 'Only modeled native units and watch rules are supported. Rule suppression and unknown finalization
  are refused. Recovery: restore the guest snapshot, or remove the owned rule files and reboot through
  the recovery console.'
applies_to:
  os: [rocky, rhel]
  major_version: 10
  role: server
impact: medium
impact_note: Inspect native state and preserve unrelated policy.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties: {}
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/audit.service-enabled.audit.yml
  apply: ansible/tasks/audit.service-enabled.apply.yml
  verify: ansible/tasks/audit.service-enabled.verify.yml
  preflight: ansible/tasks/audit.service-enabled.preflight.yml
