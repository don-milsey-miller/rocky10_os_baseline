id: auth.inactive-account-lock
title: Set selected human password-expiry inactivity limits
summary: Set selected human password-expiry inactivity limits.
rationale: Apply approved local account policy only to explicitly classified identities.
benefits:
- Preserve unselected accounts and unrelated account properties.
tradeoffs:
- Requires a local authselect profile. Root and the recovery identity cannot be selected. No password,
  last-change date, account expiry, home contents, or recursive ownership changes.
- Aging and inactivity limits can deny access after password expiry. System accounts must have UID below
  1000. Home changes support ordinary /home/account directories without ACLs.
applies_to:
  os: [rocky, rhel]
  major_version: 10
  role: server
impact: high
impact_note: Account policy may affect subsequent logins. Require independent recovery and fresh administrative
  access.
requires: []
conflicts_with: []
parameters:
  type: object
  additionalProperties: false
  properties:
    users:
      type: array
      minItems: 1
      maxItems: 16
      uniqueItems: true
      items:
        type: string
        pattern: ^[a-z_][a-z0-9_-]{0,31}$
      description: Explicit local account names. Root and the connected recovery identity are refused.
    days:
      type: integer
      minimum: 1
      maximum: 365
  required:
  - users
  - days
implemented: true
reboot_required: false
implementation:
  audit: ansible/tasks/auth.inactive-account-lock.audit.yml
  apply: ansible/tasks/auth.inactive-account-lock.apply.yml
  verify: ansible/tasks/auth.inactive-account-lock.verify.yml
  preflight: ansible/tasks/auth.inactive-account-lock.preflight.yml
