---
- name: Rocky 10 explicit server profile
  hosts: "{{ hardener_target }}"
  gather_facts: false
  become: true
  tasks:
    - name: Check target before any control
      ansible.builtin.import_tasks: preflight.yml

    - name: Execute explicitly selected controls
      ansible.builtin.include_tasks: control.yml
      loop: "{{ hardener_controls }}"
      loop_control:
        loop_var: control
        label: "{{ control.id }}"
      when: hardener_mode != 'preflight'
