---
- name: Require SSH and explicit server role
  ansible.builtin.assert:
    that:
      - ansible_connection | default('ssh') == 'ssh'
      - hardener_role | default('') == 'server'
    fail_msg: Declare hardener_role=server and use SSH transport.

- name: Inspect effective privileges
  ansible.builtin.command:
    argv: [/usr/bin/id, -u]
  register: effective_uid
  changed_when: false

- name: Require working privilege escalation
  ansible.builtin.assert:
    that: effective_uid.stdout == '0'
    fail_msg: Configure working Ansible privilege escalation.

- name: Inspect operating system and virtualization
  ansible.builtin.setup:
    gather_subset: ['!all', '!min', distribution, virtual]
    filter:
      - ansible_distribution
      - ansible_distribution_major_version
      - ansible_virtualization_type
      - ansible_virtualization_role

- name: Inspect EC2 Xen identity
  ansible.builtin.command:
    argv: [/usr/bin/cat, /sys/hypervisor/uuid]
  register: ec2_xen_identity
  changed_when: false
  failed_when: false
  when: ansible_facts.virtualization_type == 'xen'

- name: Require matching supported server guest
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Rocky', 'RedHat']
      - ansible_facts.distribution_major_version == '10'
      - "({'Rocky': 'rocky', 'RedHat': 'rhel'}.get(ansible_facts.distribution, '') in (hardener_expected_os | default([])))"
      - ansible_facts.virtualization_role == 'guest'
      - >-
        ansible_facts.virtualization_type == 'kvm' or
        (ansible_facts.virtualization_type == 'xen' and
         (ec2_xen_identity.stdout | default('') | lower).startswith('ec2'))
    fail_msg: Require a matching Rocky Linux 10 or RHEL 10 profile and a KVM or EC2 Xen guest. Never target the hypervisor.

- name: Inspect server boot target
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, get-default]
  register: boot_target
  changed_when: false

- name: Require server boot target
  ansible.builtin.assert:
    that: boot_target.stdout == 'multi-user.target'
    fail_msg: A server with multi-user.target is required.

- name: Inspect package manager
  ansible.builtin.command:
    argv: [/usr/bin/dnf, --version]
  changed_when: false

- name: Enforce tested independent recovery before high-impact changes
  ansible.builtin.include_tasks: tasks/recovery.preflight.yml
  when:
    - hardener_mode in ['apply', 'preflight']
    - hardener_controls | selectattr('impact', 'equalto', 'high') | list | length > 0

- name: Inspect selected account file prerequisites
  ansible.builtin.stat:
    path: /etc/passwd
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: account_file
  when: "'files.passwd-permissions' in hardener_selected and hardener_mode in ['apply', 'preflight']"

- name: Require an existing regular account file
  ansible.builtin.assert:
    that:
      - account_file.stat.isreg | default(false)
      - not (account_file.stat.islnk | default(false))
      - account_file.stat.nlink | default(0) == 1
    fail_msg: Restore a regular, single-link /etc/passwd before continuing.
  when: "'files.passwd-permissions' in hardener_selected and hardener_mode in ['apply', 'preflight']"

- name: Check prerequisites for kernel.protected-hardlinks
  ansible.builtin.include_tasks: preflight/kernel.yml
  when: "'kernel.protected-hardlinks' in hardener_selected and hardener_mode in ['apply', 'preflight']"

- name: Check prerequisites for services.debug-shell-disabled
  ansible.builtin.include_tasks: preflight/debug-shell.yml
  when: "'services.debug-shell-disabled' in hardener_selected and hardener_mode in ['apply', 'preflight']"

- name: Check prerequisites for packages.telnet-client-absent
  ansible.builtin.include_tasks: preflight/telnet.yml
  when: "'packages.telnet-client-absent' in hardener_selected and hardener_mode in ['apply', 'preflight']"

- name: Check prerequisites for packages.local-signature-check
  ansible.builtin.include_tasks: preflight/dnf-signatures.yml
  when: "'packages.local-signature-check' in hardener_selected and hardener_mode in ['apply', 'preflight']"

- name: Inspect all additional control prerequisites before any writes
  ansible.builtin.include_tasks: "{{ prerequisite.implementation.preflight }}"
  loop: "{{ hardener_controls }}"
  loop_control:
    loop_var: prerequisite
    label: "{{ prerequisite.id }}"
  vars:
    control: "{{ prerequisite }}"
  when:
    - hardener_mode in ['apply', 'preflight']
    - "'preflight' in prerequisite.implementation"

- name: Record successful preflight
  ansible.builtin.set_fact:
    hardener_preflight_passed: true
