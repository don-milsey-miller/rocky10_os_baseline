---
- name: Read ordered boot-time sysctl configuration
  ansible.builtin.command:
    argv: [/usr/lib/systemd/systemd-sysctl, --cat-config, --tldr]
  register: sysctl_configuration
  changed_when: false

- name: Interpret suid-dumpable configuration precedence
  ansible.builtin.set_fact:
    suid_dumpable_config: "{{ sysctl_configuration.stdout | hardener_sysctl_state('fs.suid_dumpable', '0') }}"
