- name: Read actual recovery identity
  ansible.builtin.include_tasks: access-context.inspect.yml
- name: Inspect or update selected local session policy privately
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/helpers/local_sessions.py'') }}'
    - default-umask
    - '{{ control.effective_parameters | to_json }}'
    - '{{ access_context.user }}'
    - inspect
  register: local_session_result
  no_log: true
  changed_when: false
- name: Retain selected local session evidence
  ansible.builtin.set_fact:
    local_session_state: '{{ local_session_result.stdout | from_json }}'
  no_log: true
- name: Record selected local session policy
  ansible.builtin.set_fact:
    hardener_record:
      id: '{{ control.id }}'
      status: '{{ ''unsupported'' if not local_session_state.supported else (''pass'' if local_session_state.matches
        else ''fail'') }}'
      observed: '{{ local_session_state }}'
      expected: Set selected interactive Bash creation defaults.
      changed: '{{ hardener_changed }}'
      reason: Selected interactive Bash defaults or native su admission rule. Running programs and other
        shells are outside this policy.
      reboot_required: false
