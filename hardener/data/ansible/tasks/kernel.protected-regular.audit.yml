---
- name: Read current protected-regular protection
  ansible.builtin.command:
    argv: [/usr/sbin/sysctl, -n, fs.protected_regular]
  register: protected_regular_live
  changed_when: false

- name: Inspect persistent protected-regular policy
  ansible.builtin.include_tasks: kernel.protected-regular.inspect.yml

- name: Report protected-regular policy audit
  ansible.builtin.set_fact:
    hardener_record:
      id: "{{ control.id }}"
      status: "{{ 'pass' if protected_regular_live.stdout == '2' and protected_regular_config.persistent == '2' else 'fail' }}"
      observed: "live={{ protected_regular_live.stdout }} persistent={{ protected_regular_config.persistent }}"
      expected: live=2 persistent=2
      changed: false
      reason: null
      reboot_required: false
