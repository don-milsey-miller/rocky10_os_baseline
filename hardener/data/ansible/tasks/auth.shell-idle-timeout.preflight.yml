- name: Read actual recovery identity
  ansible.builtin.include_tasks: access-context.inspect.yml
- name: Inspect or update selected local session policy privately
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/helpers/local_sessions.py'') }}'
    - shell-idle-timeout
    - '{{ control.effective_parameters | to_json }}'
    - '{{ access_context.user }}'
    - inspect
  register: local_session_result
  no_log: true
  changed_when: false
- name: Retain selected local session evidence
  ansible.builtin.set_fact:
    local_session_state: '{{ local_session_result.stdout | from_json }}'
  no_log: true
- name: Require supported local session policy
  ansible.builtin.assert:
    that: local_session_state.supported
    fail_msg: Require stock vendor and user startup files, explicit non-recovery local Bash users, safe
      managed paths, and a permitted su group containing the recovery administrator. Custom or conflicting
      startup policy requires review.
