- name: Read actual recovery identity
  ansible.builtin.include_tasks: access-context.inspect.yml
- name: Inspect or update selected local account policy privately
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/helpers/local_accounts.py'') }}'
    - system-login-disabled
    - '{{ control.effective_parameters | to_json }}'
    - '{{ access_context.user }}'
    - apply
  register: local_account_result
  no_log: true
  changed_when: (local_account_result.stdout | from_json).changed | default(false) | bool
- name: Retain bounded local account evidence
  ansible.builtin.set_fact:
    local_account_state: '{{ local_account_result.stdout | from_json }}'
  no_log: true
- name: Require supported explicit local account policy
  ansible.builtin.assert:
    that: local_account_state.supported
    fail_msg: Select existing local accounts with safe database and home metadata. Root, recovery identities,
      domain profiles, duplicate records and unsupported account classifications are refused.
- name: Retain selected account changes
  ansible.builtin.set_fact:
    hardener_changed: '{{ local_account_state.changed }}'
- name: Prove administrative access after account changes
  ansible.builtin.include_tasks: access-check.inspect.yml
