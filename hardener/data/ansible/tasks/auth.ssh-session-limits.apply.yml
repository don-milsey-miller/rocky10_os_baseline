- name: Manage the explicitly selected SSH policy
  ansible.builtin.include_tasks: ssh-policy.apply.yml
  vars:
    ssh_values:
      MaxAuthTries: '{{ control.effective_parameters.max_auth_tries | string }}'
      MaxSessions: '{{ control.effective_parameters.max_sessions | string }}'
      MaxStartups: '{{ control.effective_parameters.max_startups | string }}'
      LoginGraceTime: '{{ control.effective_parameters.login_grace_seconds | string }}'
      ChannelTimeout: session*={{ control.effective_parameters.idle_session_seconds }}
