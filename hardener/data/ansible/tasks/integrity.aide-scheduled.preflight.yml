- name: Inspect selected M11 policy privately
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/helpers/integrity_policy.py'') }}'
    - '{{ control.effective_parameters | to_json }}'
    - inspect
  register: m11_result
  no_log: true
  changed_when: false
- name: Retain bounded M11 evidence
  ansible.builtin.set_fact:
    m11_state: '{{ m11_result.stdout | from_json }}'
  no_log: true
- name: Require supported integrity.aide-scheduled
  ansible.builtin.assert:
    that: m11_state.supported
    fail_msg: Require installed AIDE, safe explicit directories and an approved initial baseline. Existing
      database scope, drifted units or candidate files require review.
