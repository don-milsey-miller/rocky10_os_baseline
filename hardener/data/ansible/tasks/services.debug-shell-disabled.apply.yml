---
- name: Stop the debug console
  ansible.builtin.systemd_service:
    name: debug-shell.service
    state: stopped
  register: debug_stop

- name: Preserve stop evidence
  ansible.builtin.set_fact:
    hardener_changed: "{{ debug_stop.changed }}"

- name: Persistently mask the debug console
  ansible.builtin.file:
    path: /etc/systemd/system/debug-shell.service
    src: /dev/null
    state: link
    force: false
  register: debug_mask

- name: Preserve mask evidence
  ansible.builtin.set_fact:
    hardener_changed: "{{ hardener_changed or debug_mask.changed }}"

- name: Reload systemd after the persistent mask changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: debug_mask.changed
