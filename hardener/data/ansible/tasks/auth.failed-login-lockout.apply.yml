- name: Read actual recovery identity
  ansible.builtin.include_tasks: access-context.inspect.yml
- name: Inspect or update native local authentication policy privately
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/helpers/local_pam.py'') }}'
    - failed-login-lockout
    - '{{ control.effective_parameters | to_json }}'
    - '{{ access_context.user }}'
    - apply
  register: local_pam_result
  no_log: true
  changed_when: (local_pam_result.stdout | from_json).changed | default(false) | bool
- name: Retain native authentication policy evidence
  ansible.builtin.set_fact:
    local_pam_state: '{{ local_pam_result.stdout | from_json }}'
  no_log: true
- name: Require supported local authentication policy
  ansible.builtin.assert:
    that: local_pam_state.supported
    fail_msg: Require an intact vendor local authselect profile, safe policy files, modeled PAM options
      and a lockout-exempt recovery group. Domain providers, custom stacks and password-quality drop-ins
      require operator review.
- name: Retain authentication policy changes
  ansible.builtin.set_fact:
    hardener_changed: '{{ local_pam_state.changed }}'
- name: Prove administrative access after authentication changes
  ansible.builtin.include_tasks: access-check.inspect.yml
