- name: Read current connection context
  ansible.builtin.include_tasks: access-context.inspect.yml
- name: Inspect native SSH state and isolated candidate privately
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/helpers/ssh_policy.py'') }}'
    - '{{ ssh_values | to_json }}'
    - '{{ access_context | to_json }}'
    - '{{ ''candidate'' if hardener_mode in [''apply'', ''preflight''] else ''inspect'' }}'
  changed_when: false
  register: ssh_inspection
  no_log: true
- name: Retain SSH evidence privately
  ansible.builtin.set_fact:
    ssh_state: '{{ ssh_inspection.stdout | from_json }}'
  no_log: true
