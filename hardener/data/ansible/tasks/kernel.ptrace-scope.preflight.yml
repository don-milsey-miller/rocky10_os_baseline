---
- name: Inspect managed sysctl configuration path
  ansible.builtin.stat:
    path: /etc/sysctl.d/99-rocky10-hardener.conf
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: ptrace_scope_path

- name: Require absent or regular single-link managed sysctl file
  ansible.builtin.assert:
    that:
      - not ptrace_scope_path.stat.exists or (ptrace_scope_path.stat.isreg | default(false) and ptrace_scope_path.stat.nlink | default(0) == 1)
    fail_msg: Restore a regular managed sysctl file before applying this control.
  when: hardener_mode in ['preflight', 'apply']

- name: Check kernel ptrace-scope parameter availability
  ansible.builtin.command:
    argv: [/usr/sbin/sysctl, -n, kernel.yama.ptrace_scope]
  changed_when: false

- name: Inspect effective sysctl file ordering
  ansible.builtin.include_tasks: kernel.ptrace-scope.inspect.yml

- name: Refuse later conflicting ptrace-scope assignments
  ansible.builtin.assert:
    that: ptrace_scope_config.blockers | length == 0
    fail_msg: Remove or reconcile later ptrace-scope assignments before applying this profile.
  when: hardener_mode in ['preflight', 'apply']
