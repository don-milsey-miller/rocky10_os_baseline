---
- name: Read effective kernel state directly from procfs
  ansible.builtin.command:
    argv: [/usr/bin/cat, /proc/sys/kernel/dmesg_restrict]
  register: dmesg_restrict_verified
  changed_when: false

- name: Independently reinspect persistent dmesg-restrict policy
  ansible.builtin.include_tasks: kernel.dmesg-restrict.inspect.yml

- name: Report dmesg-restrict policy verification
  ansible.builtin.set_fact:
    hardener_record:
      id: "{{ control.id }}"
      status: "{{ 'pass' if dmesg_restrict_verified.stdout == '1' and dmesg_restrict_config.persistent == '1' else 'fail' }}"
      observed: "live={{ dmesg_restrict_verified.stdout }} persistent={{ dmesg_restrict_config.persistent }}"
      expected: live=1 persistent=1
      changed: "{{ hardener_changed }}"
      reason: null
      reboot_required: false
