- name: Inspect selected network setting and ordered persistent policy
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/helpers/network_sysctl.py'')
      }}'
    - '{{ control.id }}'
    - '{{ network_probe_mode | default(hardener_mode) }}'
  changed_when: false
  register: network_inspection
  no_log: true
- name: Retain bounded network state
  ansible.builtin.set_fact:
    network_state: '{{ network_inspection.stdout | from_json }}'
  no_log: true
