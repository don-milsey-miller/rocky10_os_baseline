---
- name: Read effective kernel state directly from procfs
  ansible.builtin.command:
    argv: [/usr/bin/cat, /proc/sys/kernel/kptr_restrict]
  register: kptr_restrict_verified
  changed_when: false

- name: Independently reinspect persistent kptr-restrict policy
  ansible.builtin.include_tasks: kernel.kptr-restrict.inspect.yml

- name: Report kptr-restrict policy verification
  ansible.builtin.set_fact:
    hardener_record:
      id: "{{ control.id }}"
      status: "{{ 'pass' if kptr_restrict_verified.stdout == '2' and kptr_restrict_config.persistent == '2' else 'fail' }}"
      observed: "live={{ kptr_restrict_verified.stdout }} persistent={{ kptr_restrict_config.persistent }}"
      expected: live=2 persistent=2
      changed: "{{ hardener_changed }}"
      reason: null
      reboot_required: false
