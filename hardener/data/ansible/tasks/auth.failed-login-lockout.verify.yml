- name: Read actual recovery identity
  ansible.builtin.include_tasks: access-context.inspect.yml
- name: Inspect or update native local authentication policy privately
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/helpers/local_pam.py'') }}'
    - failed-login-lockout
    - '{{ control.effective_parameters | to_json }}'
    - '{{ access_context.user }}'
    - inspect
  register: local_pam_result
  no_log: true
  changed_when: false
- name: Retain native authentication policy evidence
  ansible.builtin.set_fact:
    local_pam_state: '{{ local_pam_result.stdout | from_json }}'
  no_log: true
- name: Record native local authentication policy
  ansible.builtin.set_fact:
    hardener_record:
      id: '{{ control.id }}'
      status: '{{ ''unsupported'' if not local_pam_state.supported else (''pass'' if local_pam_state.matches
        else ''fail'') }}'
      observed: '{{ local_pam_state }}'
      expected: Bound repeated local authentication failures.
      changed: '{{ hardener_changed }}'
      reason: Native configuration and effective PAM module checks. Existing credentials are never included.
      reboot_required: false
