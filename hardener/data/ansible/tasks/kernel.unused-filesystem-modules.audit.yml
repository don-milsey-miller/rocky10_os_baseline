- name: Inspect selected M12 policy privately
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/helpers/optional_policy.py'') }}'
    - unused-filesystem-modules
    - inspect
    - '{{ control.effective_parameters | to_json }}'
    - '{{ {''requested'': hardener_controls | selectattr(''id'', ''in'', [''kernel.unused-filesystem-modules'',
      ''kernel.unused-network-protocols'']) | map(attribute=''effective_parameters.modules'') | flatten,
      ''proof'': m12_initramfs_proof | default({})} | to_json }}'
  register: m12_result
  no_log: true
  changed_when: false
- name: Retain bounded M12 evidence
  ansible.builtin.set_fact:
    m12_state: '{{ m12_result.stdout | from_json }}'
  no_log: true
- name: Reuse boot inspection only while all image bytes match
  ansible.builtin.set_fact:
    m12_initramfs_proof: '{{ m12_state.initramfs_proof | default({}) }}'
  no_log: true
- name: Record independently inspected kernel.unused-filesystem-modules
  ansible.builtin.set_fact:
    hardener_record:
      id: '{{ control.id }}'
      status: '{{ ''unsupported'' if not m12_state.supported else (''pass'' if m12_state.matches else
        ''fail'') }}'
      observed: '{{ m12_state | dict2items | rejectattr(''key'', ''equalto'', ''initramfs_proof'') | items2dict
        }}'
      expected: Refuse loaded drivers and early-boot copies, then deny explicitly selected filesystem
        modules.
      changed: '{{ hardener_changed }}'
      reason: Independent native inspection. External credential values are withheld.
      reboot_required: '{{ m12_state.reboot_pending | default(false) }}'
