---
- name: Read DNF effective default without repository or plugin execution
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - "import dnf; base = dnf.Base(); base.conf.read(); print(int(base.conf.localpkg_gpgcheck)); base.close()"
  register: local_signature
  changed_when: false
