- name: Inspect selected M12 policy privately
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/helpers/optional_policy.py'') }}'
    - at-access
    - inspect
    - '{{ control.effective_parameters | to_json }}'
  register: m12_result
  no_log: true
  changed_when: false
- name: Retain bounded M12 evidence
  ansible.builtin.set_fact:
    m12_state: '{{ m12_result.stdout | from_json }}'
  no_log: true
- name: Require supported services.at-access
  ansible.builtin.assert:
    that: m12_state.supported
    fail_msg: 'Require the documented M12 prerequisites: existing safe mounts, unused modules absent from
      initramfs, complete listener activation selection, preserved job owners, native BIOS authentication
      and private external credentials, or built-in cryptographic policy without overrides.'
