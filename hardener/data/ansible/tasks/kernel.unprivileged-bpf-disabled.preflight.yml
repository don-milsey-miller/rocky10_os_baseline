---
- name: Inspect managed sysctl configuration path
  ansible.builtin.stat:
    path: /etc/sysctl.d/99-rocky10-hardener.conf
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: unprivileged_bpf_disabled_path

- name: Require absent or regular single-link managed sysctl file
  ansible.builtin.assert:
    that:
      - not unprivileged_bpf_disabled_path.stat.exists or (unprivileged_bpf_disabled_path.stat.isreg | default(false) and unprivileged_bpf_disabled_path.stat.nlink | default(0) == 1)
    fail_msg: Restore a regular managed sysctl file before applying this control.
  when: hardener_mode in ['preflight', 'apply']

- name: Check kernel unprivileged-bpf-disabled parameter availability
  ansible.builtin.command:
    argv: [/usr/sbin/sysctl, -n, kernel.unprivileged_bpf_disabled]
  changed_when: false

- name: Inspect effective sysctl file ordering
  ansible.builtin.include_tasks: kernel.unprivileged-bpf-disabled.inspect.yml

- name: Refuse later conflicting unprivileged-bpf-disabled assignments
  ansible.builtin.assert:
    that: unprivileged_bpf_disabled_config.blockers | length == 0
    fail_msg: Remove or reconcile later unprivileged-bpf-disabled assignments before applying this profile.
  when: hardener_mode in ['preflight', 'apply']

- name: Refuse an irreversible BPF lock until recovery reboot
  ansible.builtin.command:
    argv: [/usr/sbin/sysctl, -n, kernel.unprivileged_bpf_disabled]
  register: bpf_current
  changed_when: false

- name: Require reversible BPF state
  ansible.builtin.assert:
    that: bpf_current.stdout != '1'
    fail_msg: An irreversible BPF lock requires operator recovery and reboot before this policy.
