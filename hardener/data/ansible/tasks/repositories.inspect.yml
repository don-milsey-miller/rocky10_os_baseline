- name: Inspect selected repository effective configuration privately
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - |
      import configparser,dnf,json,os,stat,sys
      from pathlib import Path
      from urllib.parse import urlsplit
      selected=json.loads(sys.argv[1])
      b=dnf.Base();b.conf.read();b.conf.substitutions.update_from_etc(b.conf.installroot,varsdir=b.conf.varsdir);b.read_all_repos()
      seen=set()
      for directory in b.conf.reposdir:
          for file in Path(directory).glob('*.repo'):
              p=configparser.ConfigParser(interpolation=None,strict=True);p.read_string(file.read_text())
              if p.defaults(): raise ValueError('Inherited repository defaults require explicit review')
              for section in p.sections():
                  if section in seen: raise ValueError('Duplicate repository ID')
                  seen.add(section)
      result=[]
      for rid in selected:
          if rid not in b.repos: raise ValueError('Selected repository is unavailable')
          r=b.repos[rid];p=Path(r.repofile);s=p.lstat()
          urls=list(r.baseurl) or [r.metalink or r.mirrorlist]
          result.append({'id':rid,'path':str(p),'enabled':bool(r.enabled),
            'gpgcheck':bool(r.gpgcheck),'repo_gpgcheck':bool(r.repo_gpgcheck),'sslverify':bool(r.sslverify),
            'https':bool(urls) and all(urlsplit(u).scheme=='https' for u in urls),
            'safe_file':p.resolve()==p and p.is_relative_to('/etc/yum.repos.d') and stat.S_ISREG(s.st_mode) and s.st_nlink==1 and s.st_uid==0 and not(s.st_mode & 0o022) and 'system.posix_acl_access' not in os.listxattr(p),
            'mode':format(stat.S_IMODE(s.st_mode),'04o'),'gid':s.st_gid})
      print(json.dumps(result))
    - '{{ control.effective_parameters.repositories | to_json }}'
  changed_when: false
  no_log: true
  register: repository_inspection
- name: Retain selected repository configuration facts
  ansible.builtin.set_fact:
    repository_state: '{{ repository_inspection.stdout | from_json }}'
  no_log: true
