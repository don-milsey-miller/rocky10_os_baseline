---
- name: Read ordered boot-time sysctl configuration
  ansible.builtin.command:
    argv: [/usr/lib/systemd/systemd-sysctl, --cat-config, --tldr]
  register: sysctl_configuration
  changed_when: false

- name: Interpret protected-regular configuration precedence
  ansible.builtin.set_fact:
    protected_regular_config: "{{ sysctl_configuration.stdout | hardener_sysctl_state('fs.protected_regular', '2') }}"
