---
- name: Read current kptr-restrict protection
  ansible.builtin.command:
    argv: [/usr/sbin/sysctl, -n, kernel.kptr_restrict]
  register: kptr_restrict_live
  changed_when: false

- name: Inspect persistent kptr-restrict policy
  ansible.builtin.include_tasks: kernel.kptr-restrict.inspect.yml

- name: Report kptr-restrict policy audit
  ansible.builtin.set_fact:
    hardener_record:
      id: "{{ control.id }}"
      status: "{{ 'pass' if kptr_restrict_live.stdout == '2' and kptr_restrict_config.persistent == '2' else 'fail' }}"
      observed: "live={{ kptr_restrict_live.stdout }} persistent={{ kptr_restrict_config.persistent }}"
      expected: live=2 persistent=2
      changed: false
      reason: null
      reboot_required: false
