---
- name: Read ordered boot-time sysctl configuration
  ansible.builtin.command:
    argv: [/usr/lib/systemd/systemd-sysctl, --cat-config, --tldr]
  register: sysctl_configuration
  changed_when: false

- name: Interpret kptr-restrict configuration precedence
  ansible.builtin.set_fact:
    kptr_restrict_config: "{{ sysctl_configuration.stdout | hardener_sysctl_state('kernel.kptr_restrict', '2') }}"
