---
- name: Inspect managed sysctl configuration path
  ansible.builtin.stat:
    path: /etc/sysctl.d/99-rocky10-hardener.conf
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: dmesg_restrict_path

- name: Require absent or regular single-link managed sysctl file
  ansible.builtin.assert:
    that:
      - not dmesg_restrict_path.stat.exists or (dmesg_restrict_path.stat.isreg | default(false) and dmesg_restrict_path.stat.nlink | default(0) == 1)
    fail_msg: Restore a regular managed sysctl file before applying this control.
  when: hardener_mode in ['preflight', 'apply']

- name: Check kernel dmesg-restrict parameter availability
  ansible.builtin.command:
    argv: [/usr/sbin/sysctl, -n, kernel.dmesg_restrict]
  changed_when: false

- name: Inspect effective sysctl file ordering
  ansible.builtin.include_tasks: kernel.dmesg-restrict.inspect.yml

- name: Refuse later conflicting dmesg-restrict assignments
  ansible.builtin.assert:
    that: dmesg_restrict_config.blockers | length == 0
    fail_msg: Remove or reconcile later dmesg-restrict assignments before applying this profile.
  when: hardener_mode in ['preflight', 'apply']
