- name: Inspect selected log file metadata
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - |
      import json,os,stat,sys
      from pathlib import Path
      policy=json.loads(sys.argv[1]);result=[]
      for path in policy['paths']:
       p=Path(path);exists=os.path.lexists(p);safe=False;mode=None
       if exists:
        s=p.lstat();mode=format(stat.S_IMODE(s.st_mode),'04o')
        safe=p.resolve()==p and stat.S_ISREG(s.st_mode) and s.st_nlink==1 and 'system.posix_acl_access' not in os.listxattr(p)
        for parent in p.parents:
         t=parent.stat();safe=safe and t.st_uid==0 and not(t.st_mode & 0o022)
       result.append({'path':path,'exists':exists,'safe':safe,'mode':mode,'matches':mode==policy['mode']})
      print(json.dumps(result))
    - '{{ control.effective_parameters | to_json }}'
  changed_when: false
  register: logfiles_inspection
- name: Read log metadata evidence
  ansible.builtin.set_fact:
    logfiles_state: '{{ logfiles_inspection.stdout | from_json }}'
