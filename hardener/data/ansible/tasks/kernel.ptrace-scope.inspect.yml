---
- name: Read ordered boot-time sysctl configuration
  ansible.builtin.command:
    argv: [/usr/lib/systemd/systemd-sysctl, --cat-config, --tldr]
  register: sysctl_configuration
  changed_when: false

- name: Interpret ptrace-scope configuration precedence
  ansible.builtin.set_fact:
    ptrace_scope_config: "{{ sysctl_configuration.stdout | hardener_sysctl_state('kernel.yama.ptrace_scope', '1') }}"
