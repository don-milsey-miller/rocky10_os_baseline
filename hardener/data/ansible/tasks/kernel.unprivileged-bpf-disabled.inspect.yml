---
- name: Read ordered boot-time sysctl configuration
  ansible.builtin.command:
    argv: [/usr/lib/systemd/systemd-sysctl, --cat-config, --tldr]
  register: sysctl_configuration
  changed_when: false

- name: Interpret unprivileged-bpf-disabled configuration precedence
  ansible.builtin.set_fact:
    unprivileged_bpf_disabled_config: "{{ sysctl_configuration.stdout | hardener_sysctl_state('kernel.unprivileged_bpf_disabled', '2') }}"
