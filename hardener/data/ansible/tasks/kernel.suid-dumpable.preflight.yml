---
- name: Inspect managed sysctl configuration path
  ansible.builtin.stat:
    path: /etc/sysctl.d/99-rocky10-hardener.conf
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: suid_dumpable_path

- name: Require absent or regular single-link managed sysctl file
  ansible.builtin.assert:
    that:
      - not suid_dumpable_path.stat.exists or (suid_dumpable_path.stat.isreg | default(false) and suid_dumpable_path.stat.nlink | default(0) == 1)
    fail_msg: Restore a regular managed sysctl file before applying this control.
  when: hardener_mode in ['preflight', 'apply']

- name: Check kernel suid-dumpable parameter availability
  ansible.builtin.command:
    argv: [/usr/sbin/sysctl, -n, fs.suid_dumpable]
  changed_when: false

- name: Inspect effective sysctl file ordering
  ansible.builtin.include_tasks: kernel.suid-dumpable.inspect.yml

- name: Refuse later conflicting suid-dumpable assignments
  ansible.builtin.assert:
    that: suid_dumpable_config.blockers | length == 0
    fail_msg: Remove or reconcile later suid-dumpable assignments before applying this profile.
  when: hardener_mode in ['preflight', 'apply']
