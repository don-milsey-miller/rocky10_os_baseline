- name: Inspect selected M11 policy privately
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/helpers/remote_logging.py'') }}'
    - '{{ control.effective_parameters | to_json }}'
    - inspect
  register: m11_result
  no_log: true
  changed_when: false
- name: Retain bounded M11 evidence
  ansible.builtin.set_fact:
    m11_state: '{{ m11_result.stdout | from_json }}'
  no_log: true
- name: Require supported logging.remote-tls
  ansible.builtin.assert:
    that: m11_state.supported
    fail_msg: Require native rsyslog configuration, external safe CA trust, reachable authenticated TLS
      peer and no unreviewed active routing overrides.
