- name: Manage the explicitly selected SSH policy
  ansible.builtin.include_tasks: ssh-policy.apply.yml
  vars:
    ssh_values:
      DisableForwarding: 'no'
      AllowTcpForwarding: '{{ control.effective_parameters.tcp }}'
      AllowStreamLocalForwarding: '{{ control.effective_parameters.streamlocal }}'
      AllowAgentForwarding: '{{ ''yes'' if control.effective_parameters.agent else ''no'' }}'
      X11Forwarding: '{{ ''yes'' if control.effective_parameters.x11 else ''no'' }}'
      PermitTunnel: '{{ ''yes'' if control.effective_parameters.tunnel else ''no'' }}'
