---
- name: Read current suid-dumpable protection
  ansible.builtin.command:
    argv: [/usr/sbin/sysctl, -n, fs.suid_dumpable]
  register: suid_dumpable_live
  changed_when: false

- name: Inspect persistent suid-dumpable policy
  ansible.builtin.include_tasks: kernel.suid-dumpable.inspect.yml

- name: Report suid-dumpable policy audit
  ansible.builtin.set_fact:
    hardener_record:
      id: "{{ control.id }}"
      status: "{{ 'pass' if suid_dumpable_live.stdout == '0' and suid_dumpable_config.persistent == '0' else 'fail' }}"
      observed: "live={{ suid_dumpable_live.stdout }} persistent={{ suid_dumpable_config.persistent }}"
      expected: live=0 persistent=0
      changed: false
      reason: null
      reboot_required: false
