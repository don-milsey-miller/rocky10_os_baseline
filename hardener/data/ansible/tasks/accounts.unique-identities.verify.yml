- name: Inspect local identity state privately
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/helpers/account_assessment.py'') }}'
    - unique-identities
  register: account_assessment
  changed_when: false
  no_log: true
- name: Retain bounded identity evidence
  ansible.builtin.set_fact:
    account_state: '{{ account_assessment.stdout | from_json }}'
  no_log: true
- name: Record local identity assessment
  ansible.builtin.set_fact:
    hardener_record:
      id: '{{ control.id }}'
      status: '{{ ''pass'' if account_state.matches else ''fail'' }}'
      observed: '{{ account_state }}'
      expected: Identify duplicate local account and group names or numeric identities.
      changed: false
      reason: Assessment only. Review findings without automatic identity changes.
      reboot_required: false
