- name: Inspect selected filesystem policy privately
  ansible.builtin.command:
    argv:
    - /usr/bin/python3
    - -c
    - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/helpers/filesystem_policy.py'') }}'
    - tmp-restrictions
    - inspect
    - '{{ control.effective_parameters | to_json }}'
  register: filesystem_policy
  changed_when: false
  no_log: true
- name: Retain bounded filesystem evidence
  ansible.builtin.set_fact:
    filesystem_state: '{{ filesystem_policy.stdout | from_json }}'
  no_log: true
- name: Require supported existing filesystem configuration
  ansible.builtin.assert:
    that: filesystem_state.supported
    fail_msg: Require supported existing fstab mounts or protected explicit shared directories. Review
      mount sources, configuration ownership and systemd overrides.
