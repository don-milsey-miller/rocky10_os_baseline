[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rocky10-os-baseline"
version = "0.5.0rc1"
description = "Explicit, profile-driven hardening for Rocky Linux 10 KVM servers"
requires-python = ">=3.12"
dependencies = ["ansible-core==2.19.15", "PyYAML==6.0.3", "jsonschema==4.26.0"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "ruff==0.17.3", "build==1.6.1"]

[project.scripts]
hardener = "hardener.cli:main"

[tool.setuptools.packages.find]
include = ["hardener*"]

[tool.setuptools.package-data]
hardener = ["data/**/*.json", "data/**/*.yaml", "data/**/*.yml", "data/**/*.py", "data/*.cfg"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
