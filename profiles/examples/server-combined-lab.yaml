# Disposable acceptance fixture only. Requires the documented M6-M12 lab prerequisites.
schema_version: 1
id: rocky10-combined-lab
revision: 1
target:
  os: rocky
  major_version: 10
  role: server
controls:
- id: accounts.home-permissions
  enabled: true
  parameters:
    users:
    - m10human
    mode: '0700'
- id: accounts.no-empty-passwords
  enabled: true
- id: accounts.root-only-uid-zero
  enabled: true
- id: accounts.root-path-integrity
  enabled: true
- id: accounts.system-login-disabled
  enabled: true
  parameters:
    users:
    - m10service
- id: accounts.unique-identities
  enabled: true
- id: audit.early-boot
  enabled: true
  parameters:
    backlog_limit: 8192
- id: audit.identity-changes
  enabled: true
- id: audit.immutable-rules
  enabled: true
- id: audit.privilege-use
  enabled: true
- id: audit.security-config-changes
  enabled: true
- id: audit.service-enabled
  enabled: true
- id: audit.session-events
  enabled: true
- id: audit.storage-policy
  enabled: true
  parameters:
    max_log_file_mib: 20
    num_logs: 5
    space_left_mib: 75
    admin_space_left_mib: 50
    space_left_action: syslog
    admin_space_left_action: syslog
    disk_full_action: syslog
    disk_error_action: syslog
- id: auth.default-umask
  enabled: true
  parameters:
    users:
    - m10human
    mask: '0027'
- id: auth.failed-login-lockout
  enabled: true
  parameters:
    attempts: 5
    interval_seconds: 900
    unlock_seconds: 900
    exempt_group: wheel
- id: auth.inactive-account-lock
  enabled: true
  parameters:
    users:
    - m10human
    days: 30
- id: auth.password-aging
  enabled: true
  parameters:
    users:
    - m10human
    minimum_days: 0
    maximum_days: 90
    warning_days: 14
- id: auth.password-history
  enabled: true
  parameters:
    remember: 5
- id: auth.password-quality
  enabled: true
  parameters:
    minimum_length: 14
- id: auth.shell-idle-timeout
  enabled: true
  parameters:
    users:
    - m10human
    seconds: 900
- id: auth.ssh-access-policy
  enabled: true
  parameters:
    users:
    - zero
    - m8admin
    groups:
    - wheel
- id: auth.ssh-config-permissions
  enabled: true
- id: auth.ssh-empty-passwords
  enabled: true
- id: auth.ssh-forwarding-policy
  enabled: true
  parameters:
    tcp: 'no'
    streamlocal: 'no'
    agent: false
    x11: false
    tunnel: false
- id: auth.ssh-hostbased-auth
  enabled: true
- id: auth.ssh-hostkey-permissions
  enabled: true
- id: auth.ssh-password-login
  enabled: true
- id: auth.ssh-root-login
  enabled: true
- id: auth.ssh-session-limits
  enabled: true
  parameters:
    max_auth_tries: 2
    max_sessions: 2
    max_startups: 3
    login_grace_seconds: 30
    idle_session_seconds: 300
- id: auth.su-access-policy
  enabled: true
  parameters:
    group: wheel
- id: auth.sudo-authentication
  enabled: true
  parameters:
    users:
    - m8admin
- id: auth.sudo-config-permissions
  enabled: true
- id: auth.sudo-timeout
  enabled: true
  parameters:
    users:
    - m8admin
    minutes: 0
- id: auth.sudo-use-pty
  enabled: true
- id: boot.config-permissions
  enabled: true
- id: boot.loader-authentication
  enabled: true
  parameters:
    hash_file: /root/.hardener-m12/grub.hash
- id: boot.rescue-authentication
  enabled: true
  parameters:
    hash_file: /root/.hardener-m12/root.hash
- id: boot.secure-boot
  enabled: true
- id: crypto.system-policy
  enabled: true
  parameters:
    policy: DEFAULT
- id: files.account-backup-permissions
  enabled: true
- id: files.group-permissions
  enabled: true
- id: files.gshadow-permissions
  enabled: true
- id: files.passwd-permissions
  enabled: true
- id: files.shadow-permissions
  enabled: true
- id: filesystem.dev-shm-restrictions
  enabled: true
  parameters:
    flags:
    - nodev
    - nosuid
    - noexec
- id: filesystem.home-restrictions
  enabled: true
  parameters:
    flags:
    - nodev
    - nosuid
- id: filesystem.privileged-files-review
  enabled: true
  parameters:
    paths:
    - /etc
    - /srv
    - /boot
    max_entries: 50000
    approved_paths: []
- id: filesystem.shared-directory-sticky
  enabled: true
  parameters:
    paths:
    - /srv/hardener-m12-shared
- id: filesystem.tmp-restrictions
  enabled: true
  parameters:
    flags:
    - nodev
    - nosuid
    - noexec
- id: filesystem.unowned-files-review
  enabled: true
  parameters:
    paths:
    - /etc
    - /srv
    - /boot
    max_entries: 50000
- id: filesystem.var-tmp-restrictions
  enabled: true
  parameters:
    flags:
    - nodev
    - nosuid
    - noexec
- id: filesystem.world-writable-review
  enabled: true
  parameters:
    paths:
    - /etc
    - /srv
    - /boot
    max_entries: 50000
- id: firewall.firewalld-enabled
  enabled: true
  parameters:
    owner: firewalld
    network_role: non-routing
    container_networking: absent
- id: firewall.inbound-policy
  enabled: true
  parameters:
    interfaces:
    - ens3
    - ens4
    services: []
    tcp_ports: []
    udp_ports: []
- id: firewall.management-access
  enabled: true
  parameters:
    ssh_port: 22
    ipv4_sources:
    - 192.0.2.10/32
    ipv6_sources:
    - fd90:9::10/128
- id: integrity.aide-scheduled
  enabled: true
  parameters:
    paths:
    - /srv/m11-baseline
    initialize_baseline: true
    schedule: daily
- id: kernel.dmesg-restrict
  enabled: true
- id: kernel.kptr-restrict
  enabled: true
- id: kernel.protected-fifos
  enabled: true
- id: kernel.protected-hardlinks
  enabled: true
- id: kernel.protected-regular
  enabled: true
- id: kernel.protected-symlinks
  enabled: true
- id: kernel.ptrace-scope
  enabled: true
- id: kernel.randomize-address-space
  enabled: true
- id: kernel.suid-dumpable
  enabled: true
- id: kernel.unprivileged-bpf-disabled
  enabled: true
- id: kernel.unused-filesystem-modules
  enabled: true
  parameters:
    modules:
    - udf
- id: kernel.unused-network-protocols
  enabled: true
  parameters:
    modules:
    - sctp
- id: logging.journal-persistent
  enabled: true
- id: logging.journal-retention
  enabled: true
  parameters:
    max_use_mib: 128
    keep_free_mib: 256
    retention_days: 7
- id: logging.logfile-permissions
  enabled: true
  parameters:
    paths:
    - /var/log/hardener-m7-probe.log
    mode: '0640'
- id: logging.remote-tls
  enabled: true
  parameters:
    host: 192.0.2.30
    port: 6514
    peer_name: logs.lab.test
    ca_file: /etc/pki/rsyslog/lab-ca.pem
- id: logging.rotation-policy
  enabled: true
  parameters:
    paths:
    - /var/log/hardener-m7-probe.log
    mode: '0640'
    frequency: daily
    retain: 3
    reopen: none
- id: login.authorized-use-banner
  enabled: true
  parameters:
    text: Authorized laboratory access only.
- id: network.ip-forwarding-disabled
  enabled: true
  parameters:
    network_role: non-routing
    container_networking: absent
- id: network.ipv4-redirects-disabled
  enabled: true
  parameters:
    network_role: non-routing
- id: network.ipv4-send-redirects-disabled
  enabled: true
  parameters:
    network_role: non-routing
- id: network.ipv4-source-route-disabled
  enabled: true
- id: network.ipv6-redirects-disabled
  enabled: true
  parameters:
    network_role: non-routing
- id: network.ipv6-source-route-disabled
  enabled: true
- id: network.reverse-path-filter
  enabled: true
  parameters:
    mode: strict
- id: network.tcp-syncookies
  enabled: true
- id: packages.local-signature-check
  enabled: true
- id: packages.repository-metadata-signature
  enabled: true
  parameters:
    repositories:
    - hardener-m7
- id: packages.repository-signature-check
  enabled: true
  parameters:
    repositories:
    - hardener-m7
- id: packages.repository-tls-verification
  enabled: true
  parameters:
    repositories:
    - hardener-m7
- id: packages.security-update-status
  enabled: true
  parameters:
    repositories:
    - hardener-m7
- id: packages.telnet-client-absent
  enabled: true
- id: selinux.enforcing
  enabled: true
- id: selinux.no-unconfined-services
  enabled: true
- id: selinux.targeted-policy
  enabled: true
- id: services.at-access
  enabled: true
  parameters:
    users:
    - root
    - m12allowed
- id: services.avahi-disabled
  enabled: true
- id: services.cron-access
  enabled: true
  parameters:
    users:
    - root
    - m12allowed
- id: services.cups-disabled
  enabled: true
- id: services.debug-shell-disabled
  enabled: true
- id: services.legacy-listeners-disabled
  enabled: true
  parameters:
    units:
    - m12-obsolete.socket
    - m12-obsolete.service
- id: storage.disk-encryption
  enabled: true
  parameters:
    paths:
    - /
- id: storage.partition-layout
  enabled: true
  parameters:
    paths:
    - /boot
    - /tmp
    - /var/tmp
    - /home
- id: time.approved-sources
  enabled: true
  parameters:
    sources:
    - 2.rocky.pool.ntp.org
    source_type: pool
- id: time.chrony-enabled
  enabled: true
